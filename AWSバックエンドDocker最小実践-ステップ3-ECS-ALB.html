  (function () {
    var DRAWIO_NAME = "AWSバックエンドDocker最小実践-ステップ3-ECS-ALB.drawio";
    var view = document.getElementById("view");

    function mount(xml) {
      var el = document.createElement("div");
      el.className = "mxgraph";
      el.setAttribute("data-mxgraph", JSON.stringify({
        highlight: "#0000ff",
        nav: true,
        resize: true,
        toolbar: "zoom layers lightbox",
        lightbox: false,
        xml: xml
      }));
      view.appendChild(el);
      var s = document.createElement("script");
      s.src = "https://viewer.diagrams.net/js/viewer-static.min.js";
      s.onerror = function () {
        view.innerHTML = '<p class="err">diagrams.net Viewer を読み込めませんでした。ネット接続を確認してください。</p>';
      };
      document.body.appendChild(s);
    }

    function embedded() {
      return document.getElementById("drawio-xml").textContent;
    }

    // 同じフォルダの .drawio を優先して読む（更新がそのまま反映される）
    fetch("./" + encodeURI(DRAWIO_NAME))
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(mount)
      .catch(function () {
        // file:// など fetch できないときは、埋め込み済みの同内容を描画
        mount(embedded());
      });
  })();
